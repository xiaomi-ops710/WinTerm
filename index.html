<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#ccc;overflow:hidden;font:14px 'Segoe UI Variable','Yu Gothic UI','Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 600px at 15% 10%,#0b3a7a,transparent 60%),radial-gradient(800px 600px at 90% 95%,#1c1c78,transparent 60%),#05070d}
#boot{position:fixed;inset:0;background:#000;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:90px;cursor:pointer}
.logo{display:grid;grid-template-columns:repeat(2,54px);gap:5px}.logo i{height:54px;background:linear-gradient(135deg,#4cc2ff,#0067c0)}
.spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:sp 1s cubic-bezier(.5,.1,.5,.9) infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bar{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:rgba(32,32,32,.6);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.08);border-top-color:rgba(255,255,255,.16);user-select:none;-webkit-user-select:none;position:relative}
#tabs{display:flex;gap:2px;overflow-x:auto;min-width:0}
.tab{height:34px;min-width:120px;max-width:220px;padding:0 8px 0 12px;display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;color:#c8c8c8;border:1px solid transparent;border-bottom:0}
.tab:hover{background:rgba(255,255,255,.06)}
.tab.on{background:rgba(12,12,12,.92);color:#fff;border-color:rgba(255,255,255,.08);border-top-color:rgba(255,255,255,.16)}
.tt{overflow:hidden;text-overflow:ellipsis;flex:1}.ti{color:var(--accent);font-weight:700}
.x{font-size:11px;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;font-weight:400;opacity:.7}.x:hover{background:rgba(255,255,255,.12);opacity:1}
.bb{width:32px;height:30px;margin-bottom:2px;display:grid;place-items:center;border-radius:6px;cursor:pointer;font-size:16px}.bb:hover{background:rgba(255,255,255,.08)}
#menu{display:none;position:absolute;top:44px;left:8px;z-index:50;min-width:290px;padding:4px;background:rgba(44,44,44,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.1);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#menu div{padding:9px 12px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:20px}#menu div:hover{background:rgba(255,255,255,.08)}#menu small{color:#999}
#views{flex:1;min-height:0;display:flex}
.view{flex:1;display:none;min-width:0}.view.on{display:flex}
.con{flex:1;overflow:auto;padding:8px 12px;background:rgba(var(--bgc,12,12,12),var(--alpha,.85));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);font:var(--fw,400) var(--fs,15px)/var(--lh,1.25) var(--ff,'Cascadia Code',monospace);white-space:pre-wrap;word-break:break-all;color:var(--fg,#ccc);-webkit-overflow-scrolling:touch}
.con.god{animation:god 1.4s}@keyframes god{0%,100%{box-shadow:none}30%{box-shadow:inset 0 0 90px #ffd700}}
.inl{display:flex}.pr{white-space:pre;flex:none}.iw{position:relative;flex:1;min-width:0}
.hl,.iw input{font:inherit;padding:0;margin:0;border:0;letter-spacing:inherit;line-height:inherit}
.hl{position:absolute;left:0;top:0;width:100%;white-space:pre;overflow:hidden;pointer-events:none}
.iw input{position:relative;width:100%;background:transparent;color:transparent;caret-color:var(--fg,#ccc);outline:0;border-radius:0}
.plain .hl{display:none}.plain .iw input{color:var(--fg,#ccc)}
.y{color:#f9f1a5}.cy{color:#61d6d6}.r{color:#e74856}.gr{color:#9a9a9a}.gn{color:#16c60c}
.btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:4px;padding:6px 14px;font:inherit;cursor:pointer}.btn:hover{background:rgba(255,255,255,.12)}.btn.pri{background:var(--accent);color:#000;border-color:var(--accent)}
.set{flex:1;display:flex;min-width:0;background:rgba(32,32,32,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);color:#fff}
.nav{width:230px;padding:12px;overflow:auto;flex:none}.ni{padding:10px 12px;border-radius:6px;cursor:pointer;position:relative;margin-bottom:2px}.ni:hover{background:rgba(255,255,255,.05)}.ni.on{background:rgba(255,255,255,.09)}.ni.on::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.pg{flex:1;overflow:auto;padding:20px 32px 40px}.pg h2{font-size:28px;font-weight:600;margin:0 0 18px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:14px 16px;margin-bottom:6px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.card .tx{flex:1;min-width:200px}.card small{display:block;color:#a0a0a0;margin-top:2px}
.tin{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.5);border-radius:4px;color:#fff;padding:7px 10px;font:inherit;min-width:250px;outline:0}
.tin:focus{border-bottom:2px solid var(--accent);padding-bottom:6px;background:rgba(0,0,0,.3)}
select.tin option{background:#2b2b2b}textarea.tin{width:100%;min-height:90px;resize:vertical}
.tg input{display:none}.tg span{display:block;width:42px;height:22px;border-radius:11px;border:1px solid #aaa;position:relative;cursor:pointer}.tg span::after{content:'';position:absolute;top:4px;left:4px;width:12px;height:12px;border-radius:50%;background:#ddd;transition:.15s}
.tg input:checked+span{background:var(--accent);border-color:var(--accent)}.tg input:checked+span::after{left:25px;background:#000}
input[type=range]{accent-color:var(--accent);width:200px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:grid;place-items:center}
.dlg{width:min(460px,92vw);padding:28px;border-radius:10px;background:rgba(44,44,44,.95);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 40px rgba(0,0,0,.6);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2b2b;border:1px solid rgba(255,255,255,.15);padding:10px 18px;border-radius:8px;z-index:95;display:none}

.tab:not(.on):hover{background:rgba(255,255,255,.07)}
.ti{display:flex;align-items:center;font-weight:400}.bb{color:#ddd}
.set{flex-direction:column;background:#202020;backdrop-filter:none;-webkit-backdrop-filter:none}
.stb{display:flex;align-items:center;gap:14px;padding:10px 14px;font-size:12px;color:#fff;flex:none}
.btn.bk{padding:4px 8px;display:grid;place-items:center;background:transparent;border-color:transparent}.btn.bk:hover{background:rgba(255,255,255,.08)}
.btn.dng{background:#c42b1c;border-color:#c42b1c}
.sbody{flex:1;display:flex;min-height:0}
.nav{width:290px;padding:4px 12px 12px;overflow:auto;flex:none}
.prof{display:flex;align-items:center;gap:14px;padding:6px 8px 16px}

.sbox{position:relative;margin:0 0 12px}.sbox input{width:100%;background:#2d2d2d;border:1px solid #3a3a3a;border-bottom-color:#9a9a9a;border-radius:4px;padding:8px 32px 8px 10px;color:#fff;font:inherit;outline:0}
.sbox input:focus{border-bottom:2px solid var(--accent);padding-bottom:7px}.sbox iconify-icon{position:absolute;right:10px;top:11px;color:#ccc}
.ni{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;margin-bottom:2px;border-radius:5px;font-size:14px}
.ni.on{background:rgba(255,255,255,.07)}.ni.on::before{left:0;top:10px;bottom:10px}
.pg{flex:1;overflow:auto;padding:6px 36px 40px;max-width:980px}.pg h2{font-size:28px;font-weight:600;margin:0 0 20px}

 else if(key==='update'){html=`<div class="updh"><div class="updi">${W11I.upd.replace('<svg','<svg width="84" height="84"')}</div><div class="updt"><b>最新の状態です</b><small>最終チェック日時: ${w11Time()}</small></div><button class="btn pri" id="chk">更新プログラムのチェック</button></div>`
  +'<div class="sech">その他のオプション</div>'+urow('megaphone-24-regular','利用可能になったらすぐに最新の更新プログラムを入手する','セキュリティ以外の最新の更新プログラム、修正、機能強化がロールアウトされたら、いち早く入手しましょう。 <a class="lnk">詳細情報</a>',utg('uo',true,true))

  +uex('uh','globe-24-regular','Windows Update のヘルプ','','',`<a class="lnk">問題のある更新プログラムを簡単にアンインストールする</a><br><a class="lnk">保留中の更新プログラムの簡単なインストール</a><br><a class="lnk">デバイス ドライバーの手動更新</a>`);

/* ===== global UI ===== */
const MICON={ps:TI.ps,cmd:TI.cmd,ai:TI.ai,settings:IC('settings-20-regular',16),palette:IC('flash-20-regular',16),about:IC('question-circle-20-regular',16)};
const MENU=[['ps','Windows PowerShell','Ctrl+Shift+1'],['cmd','コマンド プロンプト','Ctrl+Shift+2'],['ai','Gemini AI Shell','Ctrl+Shift+3'],'-',['settings','設定','Ctrl+,'],['palette','コマンド パレット','Ctrl+Shift+P'],['about','バージョン情報','']];
$('#menu').innerHTML=MENU.map(m=>m==='-'?'<hr>':`<div data-t="${m[0]}"><span class="mi">${MICON[m[0]]}</span><span class="ml">${m[1]}</span><small>${m[2]}</small></div>`).join('');
const nxTab=d=>{const i=tabs.indexOf(cur);sel(tabs[(i+d+tabs.length)%tabs.length])};
function showAbout(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="dlg"><div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${WTLOGO(48)}<b style="font-size:20px">WinTerm</b></div><div style="line-height:1.8">バージョン: 1.5.0<br>Windows Terminal を Web で再現した、非公式のアプリです。<br>仮想 PowerShell: ${S.set.psver==='5'?'5.1':'7.7.0'}</div><div style="text-align:right;margin-top:20px"><button class="btn pri">OK</button></div></div>`;document.body.append(m);const c=()=>m.remove();m.querySelector('button').onclick=c;m.onclick=e=>{if(e.target===m)c()}}
const PCMDS=[['新しい Windows PowerShell タブ','Ctrl+Shift+1',()=>newTab('ps')],['新しいコマンド プロンプト タブ','Ctrl+Shift+2',()=>newTab('cmd')],['新しい Gemini AI Shell タブ','Ctrl+Shift+3',()=>newTab('ai')],['設定を開く','Ctrl+,',()=>openWT('startup')],['Windows の設定を開く','',()=>openW11('home')],['出力をクリア','⌘K',()=>cur&&cur.clear&&cur.clear()],['タブを閉じる','⌘W',()=>cur&&closeTab(cur)],['次のタブ','Ctrl+Tab',()=>nxTab(1)],['前のタブ','Ctrl+Shift+Tab',()=>nxTab(-1)],['テーマ: ダーク','',()=>setLook('theme','dark')],['テーマ: ライト','',()=>setLook('theme','light')],['バージョン情報','',showAbout]];
function openPalette(){if($('#cp'))return;const m=document.createElement('div');m.id='cp';m.className='modal cpm';m.innerHTML='<div class="cp"><input placeholder="コマンド名を入力してください" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="cpl"></div></div>';document.body.append(m);
 const inp=m.querySelector('input'),lst=m.querySelector('.cpl');let k=0,items=[];
 const draw=()=>{const f=inp.value.toLowerCase();items=PCMDS.filter(c=>c[0].toLowerCase().includes(f));k=Math.min(k,Math.max(0,items.length-1));lst.innerHTML=items.map((c,i)=>`<div class="cpi${i===k?' on':''}" data-i="${i}"><span>${esc(c[0])}</span><small>${c[1]}</small></div>`).join('')||'<div class="cpi"><span>一致するコマンドがありません</span></div>'};
 const close=()=>{m.remove();cur&&cur.inp&&cur.inp.focus()},run=i=>{const c=items[i];if(!c)return;close();c[2]()};
 inp.oninput=()=>{k=0;draw()};
 inp.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='ArrowDown'){e.preventDefault();k=Math.min(items.length-1,k+1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();k=Math.max(0,k-1);draw()}else if(e.key==='Enter'){e.preventDefault();run(k)}};
 lst.onclick=e=>{const d=e.target.closest('[data-i]');if(d)run(+d.dataset.i)};m.onclick=e=>{if(e.target===m)close()};draw();inp.focus()}
const closeMenu=()=>{$('#menu').classList.remove('show');const g=document.querySelector('.npg');if(g)g.classList.remove('open')};
$('#menu').onclick=e=>{const d=e.target.closest('[data-t]');if(!d)return;closeMenu();const k=d.dataset.t;if(k==='palette')openPalette();else if(k==='about')showAbout();else if(k==='settings')openWT('startup');else newTab(k)};
$('#drop').onclick=e=>{e.stopPropagation();const m=$('#menu'),g=document.querySelector('.npg');if(m.classList.contains('show')){closeMenu();return}m.style.left=g.offsetLeft+'px';m.classList.add('show');g.classList.add('open')};
$('#plus').onclick=()=>newTab(S.set.profile||'ps');$('#gear').onclick=()=>{const g=$('#gear');g.classList.remove('spin');void g.offsetWidth;g.classList.add('spin');openWT('startup')};
document.querySelectorAll('.wc button').forEach(b=>b.onclick=()=>toast('ウィンドウの操作はこの環境では使えません'));
addEventListener('click',closeMenu);
addEventListener('keydown',e=>{if(!cur)return;if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.target!==cur.inp&&!((e.metaKey||e.ctrlKey)&&e.key===','))return;const k=e.key.toLowerCase(),M=e.metaKey,C=e.ctrlKey;
 if(e.key==='Escape'&&$('#w11')){e.preventDefault();closeW11();return}
 if((C||M)&&e.shiftKey&&k==='p'){e.preventDefault();openPalette();return}
 if(C&&e.shiftKey&&/^Digit[1-3]$/.test(e.code)){e.preventDefault();newTab(['ps','cmd','ai'][+e.code.slice(5)-1]);return}
 if((M&&!e.shiftKey&&k==='k')||(C&&k==='l')){if(cur.con){e.preventDefault();cur.clear()}return}
 if(C&&k==='c'){if(getSelection().toString())return;e.preventDefault();if(cur.busy){cur.print('^C','gr');cur.abort&&cur.abort()}else if(cur.inp){cur.html(esc(cur.pr.textContent+cur.inp.value)+'<span class="gr">^C</span>');cur.inp.value='';cur.upd()}return}
 if((M||C)&&e.key===','){e.preventDefault();openWT('startup');return}
 if(M&&!e.shiftKey&&k==='t'){e.preventDefault();newTab(S.set.profile||'ps');return}
 if(M&&!e.shiftKey&&k==='w'){e.preventDefault();closeTab(cur);return}
 if(M&&e.shiftKey&&(e.code==='BracketRight'||e.code==='BracketLeft')){e.preventDefault();nxTab(e.code==='BracketRight'?1:-1);return}
 if(C&&e.key==='Tab'){e.preventDefault();nxTab(e.shiftKey?-1:1);return}
 if((M||e.altKey)&&/^Digit[1-9]$/.test(e.code)){e.preventDefault();const t=tabs[+e.code.slice(5)-1];t&&sel(t)}});
/* ===== PWA ===== */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('sa');
/* ===== viewport fit ===== */
(function(){const app=$('#app'),vv=window.visualViewport;const fit=()=>{const ae=document.activeElement,typing=ae&&/INPUT|TEXTAREA/.test(ae.tagName);
 if(vv&&typing&&Math.abs(vv.height-innerHeight)>80){app.style.height=(vv.height+vv.offsetTop)+'px';app.style.bottom='auto'}else{app.style.height='';app.style.bottom=''}
 if(scrollY||scrollX)scrollTo(0,0)};
 if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));document.addEventListener('focusout',()=>setTimeout(fit,50));fit()})();
/* ===== boot ===== */
applyLook();matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyLook);
function start(){newTab(S.set.profile||'ps')}
if(S.set.fast){$('#boot').remove();start()}
else{let done=false;const fin=()=>{if(done)return;done=true;removeEventListener('keydown',fin);const bt=$('#boot');bt.style.opacity='0';setTimeout(()=>{bt.remove();start()},420)};$('#boot').onclick=fin;addEventListener('keydown',fin);setTimeout(fin,2000)}
