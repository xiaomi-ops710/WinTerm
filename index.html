<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),now=()=>Date.now(),H0='<!--h-->',H=s=>H0+s;

/* ===== state ===== */
const LS='wt_state_v1';

let S={};try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}

S.set=Object.assign({apiKey:'',model:'gemini-3.8-flash',sys:'あなたは Windows Terminal に組み込まれた親切なAIアシスタントです。回答は簡潔に、日本語のプレーンテキストで答えてください。',alpha:.85,fs:15,logo:'winterm',profile:'ps',banner:'WINDOWS',fast:false},S.set);
if(!S.vfs)S.vfs=initVfs();
if(!S.v){S.v=2;if(S.set.logo==='win11')S.set.logo='winterm'}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const applyLook=()=>{const r=document.documentElement.style;r.setProperty('--alpha',S.set.alpha);r.setProperty('--fs',S.set.fs+'px')};
const getEnv=n=>{const u=n.toUpperCase();if(u==='GEMINI_API_KEY')return S.set.apiKey;if(u==='GEMINI_MODEL')return S.set.model;
 const d={USERNAME:'User',COMPUTERNAME:'WT-PWA',OS:'Windows_NT',USERPROFILE:'C:\\Users\\User',SYSTEMROOT:'C:\\Windows',PATH:'C:\\Windows\\System32;C:\\Windows'};return S.env[u]??d[u]??''};
const setEnv=(n,v)=>{const u=n.toUpperCase();if(u==='GEMINI_API_KEY')S.set.apiKey=v;else if(u==='GEMINI_MODEL')S.set.model=v;else S.env[u]=v;save();refreshSettings()};
/* ===== VFS ===== */
const kid=(d,n)=>d&&d.t==='d'?Object.keys(d.c).find(k=>k.toLowerCase()===n.toLowerCase()):undefined;
const walk=ps=>{let n=S.vfs;for(const p of ps){const k=kid(n,p);if(k===undefined)return null;n=n.c[k]}return n};
const canon=ps=>{let n=S.vfs;return ps.map(p=>{const k=kid(n,p);n=n.c[k];return k})};
function parsePath(cwd,p){p=p.replace(/\//g,'\\');let ps;if(/^[a-z]:/i.test(p)){ps=[];p=p.slice(2)}else if(p[0]==='\\')ps=[];else ps=cwd.slice();
 for(const s of p.split('\\')){if(!s||s==='.')continue;if(s==='..')ps.pop();else ps.push(s)}return ps}
function loc(cwd,p){const ps=parsePath(cwd,p),nm=ps[ps.length-1],par=walk(ps.slice(0,-1)),k=par&&nm?kid(par,nm):undefined;
 return{parts:ps,par,name:k??nm,node:k!==undefined?par.c[k]:(ps.length?null:S.vfs)}}
function expand(cwd,p){const l=loc(cwd,p);if(!/[*?]/.test(l.name||''))return[l];
 const re=new RegExp('^'+l.name.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$','i'),par=walk(l.parts.slice(0,-1));
 return par?Object.keys(par.c).filter(k=>re.test(k)).map(k=>({parts:[...l.parts.slice(0,-1),k],par,name:k,node:par.c[k]})):[]}
const pstr=ps=>'C:\\'+ps.join('\\');
const fd=m=>{const d=new Date(m),z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())}  ${z(d.getHours())}:${z(d.getMinutes())}`};
function mkdirp(cwd,p){const ps=parsePath(cwd,p);let n=S.vfs,made=false;for(const s of ps){let k=kid(n,s);if(k===undefined){n.c[s]=mkD();k=s;made=true;n.m=now()}else if(n.c[k].t!=='d')throw new Error(`'${s}' already exists as a file.`);n=n.c[k]}if(!made)throw new Error(`An item with the specified name ${pstr(ps)} already exists.`)}
const opt=(a,n)=>{const i=a.findIndex(x=>/^-\w/.test(x)&&n.startsWith(x.slice(1).toLowerCase()));return i>=0?a[i+1]:undefined};
/* ===== banner font ===== */
const FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111',
A:'111101111101101',B:'110101110101110',C:'111100100100111',D:'110101101101110',E:'111100111100111',F:'111100111100100',G:'111100101101111',H:'101101111101101',I:'111010010010111',J:'001001001101111',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'111101101101111',P:'111101111100100',Q:'111101101111001',R:'110101110101101',S:'111100111001111',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
' ':'000000000000000','!':'010010010000010','-':'000000111000000','.':'000000000000010','>':'100010001010100','_':'000000000000111','?':'111001010000010',':':'000010000010000'};
const GR=['#7fdbff','#61d6d6','#4cc2ff','#3a96dd','#0078d4'];
const bannerRows=t=>{const R=['','','','',''];for(const ch of t.toUpperCase()){const g=FONT[ch]||FONT[' '];for(let r=0;r<5;r++)R[r]+=[...g.slice(r*3,r*3+3)].map(b=>b==='1'?'██':'  ').join('')+'  '}return R};
const bannerH=t=>H(bannerRows(t).map((r,i)=>`<span style="color:${GR[i]}">${r}</span>`).join('\n'));
const winLogoH=()=>H([0,1,2,3,4,5,6].map(i=>i===3?'':`<span style="color:${i<3?'#4cc2ff':'#0078d4'}">██████  ██████</span>`).join('\n'));
/* ===== tabs ===== */
let tabs=[],cur=null,nid=1;
const TT={ps:'PowerShell',cmd:'コマンド プロンプト',ai:'Gemini AI Shell',settings:'設定'},TI={ps:'<svg width="16" height="16" viewBox="0 0 16 16"><rect x=".5" y="2" width="15" height="12" rx="2" fill="#2671be"/><path d="M4 5.6l3 2.4-3 2.4" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M8.6 11h3.4" stroke="#fff" stroke-width="1.5"/></svg>',

 ai:'<iconify-icon icon="fluent:sparkle-16-filled" width="16" height="16" style="color:#8ab4f8"></iconify-icon>',settings:'<iconify-icon icon="fluent:settings-16-regular" width="16" height="16"></iconify-icon>'};
function renderBar(){const e=$('#tabs');e.innerHTML='';tabs.forEach(t=>{const d=document.createElement('div');d.className='tab'+(t===cur?' on':'');
 d.innerHTML=`<span class="ti">${TI[t.type]}</span><span class="tt">${esc(t.title)}</span><b class="x">✕</b>`;
 d.onclick=ev=>ev.target.classList.contains('x')?closeTab(t):sel(t);e.append(d)})}

function closeTab(t){t.dead=true;t.abort&&t.abort();t.view.remove();const i=tabs.indexOf(t);tabs.splice(i,1);

function newTab(type){if(type==='settings'){const o=tabs.find(x=>x.type==='settings');if(o)return sel(o)}
 const t={id:nid++,type,cwd:['Users','User'],title:TT[type],hi:-1,conv:[]};const v=document.createElement('div');v.className='view';t.view=v;$('#views').append(v);tabs.push(t);

const setPrompt=t=>{t.pr.textContent=t.type==='ps'?`PS ${pstr(t.cwd)}> `:t.type==='cmd'?pstr(t.cwd)+'>':'Gemini> '};
function hlHtml(v){let first=true;return v.replace(/("[^"]*"?|'[^']*'?)|(\s+)|(\|)|([^\s"'|]+)/g,(m,s,w,p,x)=>{if(s)return`<span class="cy">${esc(s)}</span>`;if(w)return w;if(p){first=true;return'|'}
 let c='';if(first){first=false;c=AL[x.toLowerCase()]?'y':'r'}else if(/^-/.test(x))c='gr';else if(/^\$/.test(x))c='gn';return`<span class="${c}">${esc(x)}</span>`})}
function buildConsole(t){t.view.innerHTML='<div class="con"><div class="inl"><span class="pr"></span><div class="iw"><div class="hl"></div><input autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"></div></div></div>';
 t.con=t.view.firstChild;t.inl=t.con.firstChild;t.pr=t.inl.children[0];t.hl=t.inl.querySelector('.hl');t.inp=t.inl.querySelector('input');
 if(t.type!=='ps')t.con.classList.add('plain');
